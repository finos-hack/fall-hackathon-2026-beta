[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# No solc_version: Shibui pins =0.8.24 and EAS pins 0.8.28. Foundry picks a
# compiler per compilation unit, so both build in one project.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Shibui is built with via_ir; keep the same pipeline so its bytecode matches.
via_ir = true
ffi = false
fs_permissions = [
  { access = "read", path = "./templates" },
  { access = "read", path = "./kit.config.json" },
  { access = "read", path = "./test/fixtures" },
  { access = "read", path = "./out" },
  { access = "read-write", path = "./deployments" },
]

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@eas/=lib/eas-contracts/contracts/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@shibui/=lib/shibui/contracts/",
  "@onchaintrust/=lib/vlei-eas-contracts/src/",
]

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 1000

[fmt]
line_length = 120
