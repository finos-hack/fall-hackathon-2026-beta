name: CALM

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  calm:
    name: FINOS CALM architecture model
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the model in strict mode (schema, references, control requirements)
        run: tools/calm-docs.sh validate
      - name: The generated architecture page matches the model
        run: tools/calm-docs.sh check
