name: Demo page

# Records the demo stories from the contracts at this commit and publishes web/ to GitHub Pages.
# Pull requests record and test the page but do not publish. Pages must be enabled for the repository
# (Settings, Pages, Source: GitHub Actions) before the deploy job can publish.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record and test the demo page
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # not recursive: the kit pins Shibui's own dependencies at the top level
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build contracts
        run: npm run build
      - name: Record the stories (fails if any story outcome changes)
        run: npm run record
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate every CDM object of the recording with finos-cdm
        run: |
          pip install -r tools/cdm/requirements.txt
          python -I tools/cdm/validate.py web/data/cdm.json
      - name: Install Playwright and Chromium for the browser test
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Browser test of the demo page
        run: node --test test/browser/demo.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: record
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
