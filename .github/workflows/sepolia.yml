name: Sepolia scenario (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sepolia:
    name: Scenario on Sepolia (E3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: sepolia
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Scenario on Sepolia
        run: npm run scenario
        env:
          NETWORK: sepolia
          RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          DEPLOYER_KEY: ${{ secrets.SEPOLIA_DEPLOYER_KEY }}
      - name: Upload the deployment record
        uses: actions/upload-artifact@v4
        with:
          name: deployments-sepolia
          path: deployments/sepolia.json
